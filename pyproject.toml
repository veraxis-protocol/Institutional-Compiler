[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oic"
version = "0.1.0a0"
description = "Open Institutional Compiler - non-semantic infrastructure foundation"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
  # `oic.schemas` imports `referencing` directly to build the offline resolution
  # registry, so it is a direct dependency and is declared as one. Leaving it implicit
  # would let a jsonschema upgrade silently change the API this package relies on.
  # Keep this range in sync with requirements/runtime.in; `pip check` enforces it.
  "referencing>=0.37,<0.38",
]

[project.scripts]
oic = "oic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oic = ["py.typed"]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",    # builtin shadowing
  "ANN",  # annotations
  "ARG",  # unused arguments
  "B",    # bugbear
  "C4",   # comprehensions
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # naming
  "PTH",  # prefer pathlib
  "RET",  # return discipline
  "RUF",  # ruff-specific
  "S",    # bandit / security
  "SIM",  # simplify
  "TID",  # tidy imports
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",  # asserts are the point of a test suite
  "ARG001",  # pytest fixtures are injected by name
  "ARG002",
  # Tests exercise the shell scripts by running them. Every argv is a fixed literal
  # built in-test, never operator input, so the untrusted-input concern does not apply.
  "S603",
  "S607",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------
# mypy (strict)
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_explicit = false
no_implicit_reexport = true
show_error_codes = true
pretty = false

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--import-mode=importlib",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "contract: verifies a governing repository contract (schemas, manifests, claims)",
]

# --------------------------------------------------------------------------
# coverage
# --------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["oic"]
parallel = false

[tool.coverage.paths]
source = ["src/oic", "*/site-packages/oic"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
