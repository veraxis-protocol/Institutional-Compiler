name: CI

# Verification only. This workflow never writes to the repository, never publishes,
# never deploys, never releases, and requires no secrets. Every action is pinned to an
# immutable commit SHA rather than a floating tag, so a compromised or retagged action
# release cannot silently change what runs here.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: read-only for every job. No job may push a commit, open a PR, publish
# a package, or comment. A job that needs more than this needs review, not a wider token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Deterministic test and build behaviour.
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SOURCE_DATE_EPOCH: "1000000000"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Bootstrap integrity
  # ---------------------------------------------------------------------------
  bootstrap-integrity:
    name: bootstrap-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Verify the governing TDD digest
        # Fails if TDD-OIC-001 v1.1 changes. The expected value is fixed by the
        # governing design document and is duplicated here on purpose: if the
        # repository's own manifests were altered, this literal still fails.
        run: |
          set -euo pipefail
          expected="2a4d802130d577e4fb8fee731174ae0f2172ef2d617e3b99f068545d2b9fbf77"
          actual="$(sha256sum docs/tdd/TDD-OIC-001-v1.1.pdf | cut -d' ' -f1)"
          echo "expected: ${expected}"
          echo "actual:   ${actual}"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::TDD-OIC-001 v1.1 digest changed. This is a governance event."
            exit 1
          fi

      - name: Verify the historical bootstrap baseline
        # Reads BOOTSTRAP_MANIFEST.json and every artifact it lists from the pinned
        # bootstrap commit, through the local Git object database. The working tree is
        # not consulted, so a legitimate later change to a Class C artifact does not fail
        # here (ADR-012). The manifest is historical evidence and is never rewritten to
        # make a later tree match.
        run: |
          python -m oic.cli verify-bootstrap
          python -m oic.cli --format json verify-bootstrap > bootstrap-baseline.json

      - name: Verify all manifests (reports corpus manifest as INCOMPLETE)
        # `--all` exits 3 because the preflight corpus manifest holds only its header.
        # That is the expected state today. This step asserts the exact code, so both a
        # regression to FAIL and a premature jump to PASS are caught.
        run: |
          set +e
          python -m oic.cli --format json verify-manifest --all > manifest-report.json
          code=$?
          set -e
          cat manifest-report.json
          echo "exit code: ${code}"
          if [ "${code}" -ne 3 ]; then
            echo "::error::expected exit 3 (INCOMPLETE); got ${code}"
            exit 1
          fi

      - name: Upload manifest report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: manifest-report
          path: |
            manifest-report.json
            bootstrap-baseline.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2. Schema validation
  # ---------------------------------------------------------------------------
  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Validate draft schemas
        # Resolution is local only. No schema is fetched over the network; a $ref
        # written with a remote scheme that no local schema satisfies fails the job.
        run: |
          python -m oic.cli validate-schema
          python -m oic.cli --format json validate-schema > schema-report.json

      - name: Upload schema report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: schema-report
          path: schema-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Lint
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip check

      - name: Ruff check
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

      - name: Credential pattern scan
        # Deliberately narrow. See docs/operations/CI.md for what this does and does not
        # detect; it is a coarse tripwire, not a secret-scanning product.
        run: bash scripts/scan_forbidden_patterns.sh

  # ---------------------------------------------------------------------------
  # 4. Typecheck
  # ---------------------------------------------------------------------------
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: mypy (strict)
        run: mypy

  # ---------------------------------------------------------------------------
  # 5. Test
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Full history: the baseline contract tests read blobs from the bootstrap
          # commit through the Git object database. The default shallow clone does not
          # contain it, and the tests fail with "is the commit present in this clone?".
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Run tests with coverage
        # The suite disables outbound sockets for its whole session, so a test that
        # attempts a network call fails rather than silently succeeding.
        run: |
          pytest \
            --junitxml=junit.xml \
            --cov=oic \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 6. SBOM
  # ---------------------------------------------------------------------------
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Generate SBOM and license inventory
        # Generated from the installed, hash-verified environment, so the SBOM cannot
        # drift from requirements/dev.txt. Nothing is uploaded to a third party.
        run: bash scripts/generate_sbom.sh

      - name: Build a wheel and smoke-install it
        # Proves the wheel's metadata is self-consistent, that the package imports from
        # an installed location rather than the source tree, that the console script is
        # wired up, and that the locked runtime set alone is sufficient. The wheel is
        # built into a temporary directory and discarded; nothing is published.
        run: bash scripts/wheel_smoke_test.sh

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sbom
          path: |
            sbom/oic-python.cdx.json
            sbom/DEPENDENCY_INVENTORY.md
            sbom/LICENSES.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 7. Compose validation
  # ---------------------------------------------------------------------------
  compose-validation:
    name: compose-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Record Docker and Compose versions
        run: |
          docker --version
          docker compose version

      - name: Validate the compose configuration
        # `.env.example` is used directly as a temporary development environment file.
        # It contains only CHANGEME placeholders; no repository secret is involved.
        run: |
          docker compose \
            --env-file docker/.env.example \
            -f docker/compose.yaml \
            config

      - name: Pull the digest-pinned images
        # Proves every digest in docker/compose.yaml actually resolves and is fetchable.
        run: |
          docker compose \
            --env-file docker/.env.example \
            -f docker/compose.yaml \
            pull

      - name: Start PostgreSQL, MinIO, and OPA
        run: |
          docker compose \
            --env-file docker/.env.example \
            -f docker/compose.yaml \
            up -d

      - name: Wait for every service to become healthy
        # Bounded wait. Compose reports a service healthy only once its own healthcheck
        # succeeds, so this asserts the checks genuinely pass rather than that the
        # containers merely started.
        run: |
          set -euo pipefail
          services="postgres minio opa"
          deadline=$(( SECONDS + 180 ))
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            unhealthy=""
            for service in ${services}; do
              cid="$(docker compose --env-file docker/.env.example -f docker/compose.yaml ps -q "${service}")"
              if [ -z "${cid}" ]; then
                unhealthy="${unhealthy} ${service}(no-container)"
                continue
              fi
              state="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "${cid}")"
              if [ "${state}" != "healthy" ]; then
                unhealthy="${unhealthy} ${service}(${state})"
              fi
            done
            if [ -z "${unhealthy}" ]; then
              echo "all services healthy after $(( SECONDS ))s"
              exit 0
            fi
            echo "waiting on:${unhealthy}"
            sleep 5
          done
          echo "::error::services did not become healthy within the timeout:${unhealthy}"
          exit 1

      - name: Show service status
        if: always()
        run: |
          docker compose \
            --env-file docker/.env.example \
            -f docker/compose.yaml \
            ps

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose \
            --env-file docker/.env.example \
            -f docker/compose.yaml \
            logs --no-color --tail=200

      - name: Tear down and remove volumes
        if: always()
        run: |
          docker compose \
            --env-file docker/.env.example \
            -f docker/compose.yaml \
            down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # 8. Live ZTL demonstration gate
  #
  # The other jobs prove the repository is internally consistent. This one proves
  # the OIC->ZTL->OAM lane actually reaches the kernel: the external checkout is
  # fetched at an immutable commit, the frozen fixture set is reproduced against
  # it, and the demo suite runs with zero skips. A skip is not a pass here — the
  # whole point of the job is that fixture replay is not accepted as a substitute
  # for calling the kernel, so a missing dependency fails rather than degrading
  # into a green run that proved nothing.
  #
  # DEVELOPMENT_TEST_ONLY. No result-bearing execution, no `oic demo run`, no
  # execution authorization. A green result here is remote execution of this
  # project's own test contract; it is not independent assurance.
  # ---------------------------------------------------------------------------
  live-ztl-demo:
    name: live-ztl-demo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Provision the pinned ZTL checkout outside the OIC worktree
        # Outside the working tree on purpose: remote live validation must not
        # depend on contaminating the repository it is validating. ZTL is never
        # installed into site-packages — it stays an external checkout reached
        # only through the one authorized bridge.
        env:
          ZTL_REMOTE: https://github.com/inventor1975/ZTL
          ZTL_COMMIT: 56e1ff0510c62b04dbd85bbe08b7a6deacbf276b
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/oic-ztl-pin"
          git -C "${RUNNER_TEMP}/oic-ztl-pin" init
          git -C "${RUNNER_TEMP}/oic-ztl-pin" remote add origin "${ZTL_REMOTE}"
          git -C "${RUNNER_TEMP}/oic-ztl-pin" fetch --depth=1 origin "${ZTL_COMMIT}"
          git -C "${RUNNER_TEMP}/oic-ztl-pin" checkout --detach FETCH_HEAD
          observed="$(git -C "${RUNNER_TEMP}/oic-ztl-pin" rev-parse HEAD)"
          echo "observed ZTL HEAD: ${observed}"
          if [ "${observed}" != "${ZTL_COMMIT}" ]; then
            echo "FAIL: checkout is at ${observed}, pinned commit is ${ZTL_COMMIT}"
            exit 1
          fi
          echo "OIC_DEMO_ZTL_PATH=${RUNNER_TEMP}/oic-ztl-pin" >> "${GITHUB_ENV}"

      - name: Prove the OIC worktree is still clean
        run: |
          set -euo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "${status}" ]; then
            echo "FAIL: provisioning contaminated the OIC worktree:"
            echo "${status}"
            exit 1
          fi
          echo "OIC worktree clean"

      - name: Verify the frozen fixture identity
        env:
          EXPECTED_INDEX_SHA256: ffadd65352d69ffcf55787c6dc26339e51eaed76b4c2ae789f7c813625247145
        run: |
          set -euo pipefail
          observed="$(sha256sum adapters/ztl/fixtures/interface-freeze-v0.2/INDEX.json | cut -d' ' -f1)"
          echo "fixture INDEX.json sha256: ${observed}"
          if [ "${observed}" != "${EXPECTED_INDEX_SHA256}" ]; then
            echo "FAIL: expected ${EXPECTED_INDEX_SHA256}"
            exit 1
          fi

      - name: Run live kernel conformance
        # Exit code 0 alone is not accepted: the verifier's own counts are
        # asserted, so a future version that reported success while reproducing
        # nothing would fail here. The three not-reachable combinations stay
        # not-reachable and are never relabelled as passes.
        run: |
          set -euo pipefail
          python \
            adapters/ztl/fixtures/interface-freeze-v0.2/verify_fixtures.py \
            --ztl "${OIC_DEMO_ZTL_PATH}" \
            --dir adapters/ztl/fixtures/interface-freeze-v0.2 \
            | tee "${RUNNER_TEMP}/conformance.txt"
          grep -qx "fixtures reproduced : 13" "${RUNNER_TEMP}/conformance.txt"
          grep -qx "not-reachable (skip): 3" "${RUNNER_TEMP}/conformance.txt"
          grep -qx "mismatches          : 0" "${RUNNER_TEMP}/conformance.txt"
          grep -qx "hash problems       : 0" "${RUNNER_TEMP}/conformance.txt"
          grep -q "CONFORMANCE: PASS" "${RUNNER_TEMP}/conformance.txt"

      - name: Run the live OIC to ZTL to OAM test path
        # DEVELOPMENT_TEST_ONLY. `oic demo run` is not invoked and no execution
        # authorization is created.
        run: |
          set -euo pipefail
          pytest \
            tests/unit/test_demo_ztl.py \
            tests/integration/test_oic_ztl_oam_demo_slice_001.py \
            --junitxml="${RUNNER_TEMP}/live-ztl-junit.xml" \
            -ra

      - name: Assert the live suite ran with zero skips
        # A skipped live test in this job means the kernel was not reached, which
        # is the one thing this job exists to rule out.
        run: |
          set -euo pipefail
          python - "${RUNNER_TEMP}/live-ztl-junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = root.iter("testsuite")
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for suite in suites:
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          print(f"live suite: {passed} passed, {totals['skipped']} skipped, "
                f"{totals['failures']} failed, {totals['errors']} errors")
          problems = []
          if totals["skipped"]:
              problems.append("a skip is not a pass in this job")
          if totals["failures"] or totals["errors"]:
              problems.append("the live suite did not pass")
          if passed != 52:
              problems.append(f"expected 52 passed, observed {passed}")
          if problems:
              raise SystemExit("FAIL: " + "; ".join(problems))
          PY

      - name: Upload live gate evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: live-ztl-demo
          path: |
            ${{ runner.temp }}/conformance.txt
            ${{ runner.temp }}/live-ztl-junit.xml
          if-no-files-found: warn
