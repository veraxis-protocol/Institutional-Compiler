[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veip-core"
version = "0.1.0"
description = "Deterministic reference implementation of the frozen VEIP v0.1 generic semantic core"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
veip_core = ["data/*.json"]
